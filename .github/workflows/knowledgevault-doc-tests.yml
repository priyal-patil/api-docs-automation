name: Contentstack Doc Automation — Knowledge Vault Daily Run

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (IST = UTC+5:30, so 22:30 UTC the previous day) — same slot as the other daily runs
  workflow_dispatch:        # allow manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - 'src/knowledgevault/**'
      - 'src/shared/**'
      - '.env.example'

jobs:
  run-knowledgevault-automation:
    runs-on: ubuntu-latest
    # 3 endpoints, no live Try Out phase — short, but generous until a real run confirms it.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          CS_ORG_UID=${{ secrets.CS_ORG_UID }}
          CS_QA_EMAIL=${{ secrets.CS_QA_EMAIL }}
          CS_QA_PASSWORD=${{ secrets.CS_QA_PASSWORD }}
          CS_AUTHTOKEN=${{ secrets.CS_AUTHTOKEN }}
          CS_REGION=${{ secrets.CS_REGION || 'us' }}
          POSTMAN_API_KEY=${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_KNOWLEDGEVAULT_COLLECTION_ID=${{ secrets.POSTMAN_KNOWLEDGEVAULT_COLLECTION_ID }}
          SLACK_CHANNEL_EMAIL=${{ secrets.SLACK_CHANNEL_EMAIL }}
          ALERT_FROM_EMAIL=${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL_PASSWORD=${{ secrets.ALERT_EMAIL_PASSWORD }}
          KNOWLEDGEVAULT_DOC_URL=https://www.contentstack.com/docs/developers/apis/knowledge-vault-api
          EOF

      - name: Phase 1 — Scrape Knowledge Vault API documentation
        run: npm run scrape:knowledgevault
        continue-on-error: true   # don't stop pipeline if scraping partially fails

      - name: Phase 2 — Newman (creates a disposable test Brand Kit + content item, runs the collection live, deletes them)
        run: npm run newman:knowledgevault
        continue-on-error: true

      - name: Phase 3 — Doc ↔ Postman comparison (+ request/response body vs doc Sample Request/Response)
        run: npm run compare:knowledgevault
        continue-on-error: true

      - name: Phase 4 — Generate report + send Slack report
        run: npm run report:knowledgevault

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledgevault-doc-automation-report-${{ github.run_number }}
          path: reports/run-report-knowledgevault.*
          retention-days: 30

      - name: Fail job if critical failures
        run: |
          node -e "
            const r = require('./reports/run-report-knowledgevault.json');
            if (r.failed > 0) {
              console.error('❌ ' + r.failed + ' failure(s) detected');
              process.exit(1);
            }
            console.log('✅ All checks passed');
          "
