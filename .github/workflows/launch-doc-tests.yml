name: Contentstack Doc Automation — Launch Daily Run

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (IST = UTC+5:30, so 22:30 UTC the previous day) — same slot as every other product line
  workflow_dispatch:        # allow manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - 'src/launch/**'
      - 'src/shared/**'
      - '.env.example'

jobs:
  run-launch-automation:
    runs-on: ubuntu-latest
    # 21 endpoints. Includes a real ZIP upload + disposable project create/delete
    # (no build-wait — Create a Deployment is deliberately not exercised live,
    # see README "Launch" section) — generous timeout until real run durations are known.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          CS_ORG_UID=${{ secrets.CS_ORG_UID }}
          CS_QA_EMAIL=${{ secrets.CS_QA_EMAIL }}
          CS_QA_PASSWORD=${{ secrets.CS_QA_PASSWORD }}
          CS_AUTHTOKEN=${{ secrets.CS_AUTHTOKEN }}
          CS_REGION=${{ secrets.CS_REGION || 'us' }}
          SLACK_CHANNEL_EMAIL=${{ secrets.SLACK_CHANNEL_EMAIL }}
          ALERT_FROM_EMAIL=${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL_PASSWORD=${{ secrets.ALERT_EMAIL_PASSWORD }}
          LAUNCH_DOC_URL=https://www.contentstack.com/docs/developers/apis/launch-api
          EOF

      - name: Phase 1 — Scrape Launch API documentation
        run: npm run scrape:launch
        continue-on-error: true   # don't stop pipeline if scraping partially fails

      - name: Phase 2 — Live Try Out panel tests
        run: npm run tryout:launch
        continue-on-error: true

      - name: Phase 3 — Swagger execution (real ZIP upload + disposable project/environment create-update-delete, reads against an existing reused project/deployment)
        run: npm run swagger:launch
        continue-on-error: true

      - name: Phase 4 — Doc ↔ Try Out ↔ OpenAPI spec comparison
        run: npm run compare:launch
        continue-on-error: true

      - name: Phase 5 — Generate report + send Slack report
        run: npm run report:launch

      - name: Publish report to dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          npm run publish:launch
          git clone https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git /tmp/dashboard-data
          cd /tmp/dashboard-data
          STAGING_DIR="/tmp/reports-launch"
          if [ -d "$STAGING_DIR" ]; then
            node scripts/publish.js "$GITHUB_WORKSPACE/reports/dashboard-launch.json:$STAGING_DIR"
          else
            node scripts/publish.js "$GITHUB_WORKSPACE/reports/dashboard-launch.json"
          fi
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish api-docs-automation/launch report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-doc-automation-report-${{ github.run_number }}
          path: reports/run-report-launch.*
          retention-days: 30

      - name: Fail job if critical failures
        run: |
          node -e "
            const r = require('./reports/run-report-launch.json');
            if (r.failed > 0) {
              console.error('❌ ' + r.failed + ' failure(s) detected');
              process.exit(1);
            }
            console.log('✅ All checks passed');
          "
