name: Contentstack Doc Automation — Administration API Daily Run

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (IST = UTC+5:30, so 22:30 UTC the previous day) — same slot as every other product line
  workflow_dispatch:        # allow manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - 'src/administration/**'
      - 'src/shared/**'
      - '.env.example'

jobs:
  run-administration-automation:
    runs-on: ubuntu-latest
    # Only 31 requests and no live browser execution (no Send button on this
    # doc's Try Out panel, no Postman collection) — a plain scrape + compare,
    # much lighter than every other product line.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          SLACK_CHANNEL_EMAIL=${{ secrets.SLACK_CHANNEL_EMAIL }}
          ALERT_FROM_EMAIL=${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL_PASSWORD=${{ secrets.ALERT_EMAIL_PASSWORD }}
          ADMINISTRATION_DOC_URL=https://www.contentstack.com/docs/developers/apis/administration-api
          EOF
          # No CS_API_KEY/POSTMAN_* secrets at all — this product line has no
          # Postman collection and its Try Out panel has no Send/Execute
          # button (confirmed live), so it's a pure static doc-description
          # ↔ Try-Out-panel comparison. See README "Administration API" section.

      - name: Phase 1 — Scrape Administration API documentation (doc params + Try Out panel fields)
        run: npm run scrape:administration
        continue-on-error: true   # don't stop pipeline if scraping partially fails

      - name: Phase 2 — Doc ↔ Try Out panel comparison (param/header field gaps)
        run: npm run compare:administration
        continue-on-error: true

      - name: Phase 3 — Generate report + send Slack report
        run: npm run report:administration

      - name: Publish report to dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          npm run publish:administration
          git clone https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git /tmp/dashboard-data
          cd /tmp/dashboard-data
          STAGING_DIR="/tmp/reports-administration"
          if [ -d "$STAGING_DIR" ]; then
            node scripts/publish.js "$GITHUB_WORKSPACE/reports/dashboard-administration.json:$STAGING_DIR"
          else
            node scripts/publish.js "$GITHUB_WORKSPACE/reports/dashboard-administration.json"
          fi
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish api-docs-automation/administration report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: administration-doc-automation-report-${{ github.run_number }}
          path: reports/run-report-administration.*
          retention-days: 30

      - name: Fail job if critical failures
        run: |
          node -e "
            const r = require('./reports/run-report-administration.json');
            if (r.failed > 0) {
              console.error('❌ ' + r.failed + ' failure(s) detected');
              process.exit(1);
            }
            console.log('✅ All checks passed');
          "
