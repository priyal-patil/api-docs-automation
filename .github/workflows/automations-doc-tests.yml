name: Contentstack Doc Automation — Automations Daily Run

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (IST = UTC+5:30, so 22:30 UTC the previous day) — same slot as CDA/Analytics
  workflow_dispatch:        # allow manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - 'src/automations/**'
      - 'src/shared/**'
      - '.env.example'

jobs:
  run-automations-automation:
    runs-on: ubuntu-latest
    # 19 endpoints, no live Try Out phase — short, but generous until a real run confirms it.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          CS_ORG_UID=${{ secrets.CS_ORG_UID }}
          CS_QA_EMAIL=${{ secrets.CS_QA_EMAIL }}
          CS_QA_PASSWORD=${{ secrets.CS_QA_PASSWORD }}
          CS_AUTHTOKEN=${{ secrets.CS_AUTHTOKEN }}
          CS_REGION=${{ secrets.CS_REGION || 'us' }}
          POSTMAN_API_KEY=${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_AUTOMATIONS_COLLECTION_ID=${{ secrets.POSTMAN_AUTOMATIONS_COLLECTION_ID }}
          SLACK_CHANNEL_EMAIL=${{ secrets.SLACK_CHANNEL_EMAIL }}
          ALERT_FROM_EMAIL=${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL_PASSWORD=${{ secrets.ALERT_EMAIL_PASSWORD }}
          AUTOMATIONS_DOC_URL=https://www.contentstack.com/docs/developers/apis/automations-management-api
          EOF

      - name: Phase 1 — Scrape Automations Management API documentation
        run: npm run scrape:automations
        continue-on-error: true   # don't stop pipeline if scraping partially fails

      - name: Phase 2 — Newman (creates a disposable test project, runs the collection live, deletes it)
        run: npm run newman:automations
        continue-on-error: true

      - name: Phase 3 — Doc ↔ Postman comparison (+ request/response body vs doc Sample Request/Response)
        run: npm run compare:automations
        continue-on-error: true

      - name: Phase 4 — Generate report + send Slack report
        run: npm run report:automations

      - name: Publish report to dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          npm run publish:automations
          git clone https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git /tmp/dashboard-data
          cd /tmp/dashboard-data
          node scripts/publish.js "$GITHUB_WORKSPACE/reports/dashboard-automations.json"
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish api-docs-automation/automations report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automations-doc-automation-report-${{ github.run_number }}
          path: reports/run-report-automations.*
          retention-days: 30

      - name: Fail job if critical failures
        run: |
          node -e "
            const r = require('./reports/run-report-automations.json');
            if (r.failed > 0) {
              console.error('❌ ' + r.failed + ' failure(s) detected');
              process.exit(1);
            }
            console.log('✅ All checks passed');
          "
