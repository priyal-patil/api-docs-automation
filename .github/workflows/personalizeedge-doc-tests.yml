name: Contentstack Doc Automation — Personalize Edge Daily Run

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (IST = UTC+5:30, so 22:30 UTC the previous day) — same slot as every other product line
  workflow_dispatch:        # allow manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - 'src/personalizeedge/**'
      - 'src/shared/**'
      - '.env.example'

jobs:
  run-personalizeedge-automation:
    runs-on: ubuntu-latest
    # 4 endpoints, live Try Out phase (confirmed), no auth required — should run quickly.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          CS_REGION=${{ secrets.CS_REGION || 'us' }}
          PERSONALIZE_PROJECT_UID=${{ secrets.PERSONALIZE_PROJECT_UID }}
          SLACK_CHANNEL_EMAIL=${{ secrets.SLACK_CHANNEL_EMAIL }}
          ALERT_FROM_EMAIL=${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL_PASSWORD=${{ secrets.ALERT_EMAIL_PASSWORD }}
          PERSONALIZEEDGE_DOC_URL=https://www.contentstack.com/docs/developers/apis/personalize-edge-api
          EOF

      - name: Phase 1 — Scrape Personalize Edge API documentation
        run: npm run scrape:personalizeedge
        continue-on-error: true   # don't stop pipeline if scraping partially fails

      - name: Phase 2 — Live Try Out panel tests
        run: npm run tryout:personalizeedge
        continue-on-error: true

      - name: Phase 3 — Swagger execution (Get Manifest to bootstrap a user UID, exercises User Attributes/Events/Merge live, no cleanup needed — no resources are created)
        run: npm run swagger:personalizeedge
        continue-on-error: true

      - name: Phase 4 — Doc ↔ Try Out ↔ OpenAPI spec comparison
        run: npm run compare:personalizeedge
        continue-on-error: true

      - name: Phase 5 — Generate report + send Slack report
        run: npm run report:personalizeedge

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personalizeedge-doc-automation-report-${{ github.run_number }}
          path: reports/run-report-personalizeedge.*
          retention-days: 30

      - name: Fail job if critical failures
        run: |
          node -e "
            const r = require('./reports/run-report-personalizeedge.json');
            if (r.failed > 0) {
              console.error('❌ ' + r.failed + ' failure(s) detected');
              process.exit(1);
            }
            console.log('✅ All checks passed');
          "
