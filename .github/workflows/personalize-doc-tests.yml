name: Contentstack Doc Automation — Personalize Daily Run

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (IST = UTC+5:30, so 22:30 UTC the previous day) — same slot as every other product line
  workflow_dispatch:        # allow manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - 'src/personalize/**'
      - 'src/shared/**'
      - '.env.example'

jobs:
  run-personalize-automation:
    runs-on: ubuntu-latest
    # 28 endpoints, live Try Out phase (confirmed) — generous timeout until real run durations are known.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          CS_QA_EMAIL=${{ secrets.CS_QA_EMAIL }}
          CS_QA_PASSWORD=${{ secrets.CS_QA_PASSWORD }}
          CS_AUTHTOKEN=${{ secrets.CS_AUTHTOKEN }}
          CS_REGION=${{ secrets.CS_REGION || 'us' }}
          PERSONALIZE_PROJECT_UID=${{ secrets.PERSONALIZE_PROJECT_UID }}
          SLACK_CHANNEL_EMAIL=${{ secrets.SLACK_CHANNEL_EMAIL }}
          ALERT_FROM_EMAIL=${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL_PASSWORD=${{ secrets.ALERT_EMAIL_PASSWORD }}
          PERSONALIZE_DOC_URL=https://www.contentstack.com/docs/developers/apis/personalize-management-api
          EOF

      - name: Phase 1 — Scrape Personalize Management API documentation
        run: npm run scrape:personalize
        continue-on-error: true   # don't stop pipeline if scraping partially fails

      - name: Phase 2 — Live Try Out panel tests
        run: npm run tryout:personalize
        continue-on-error: true

      - name: Phase 3 — Swagger execution (creates disposable Attribute/Event/Audience/Experience/Version in an existing project, runs the OpenAPI-described requests live, deletes them)
        run: npm run swagger:personalize
        continue-on-error: true

      - name: Phase 4 — Doc ↔ Try Out ↔ OpenAPI spec comparison
        run: npm run compare:personalize
        continue-on-error: true

      - name: Phase 5 — Generate report + send Slack report
        run: npm run report:personalize

      - name: Publish report to dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_DATA_TOKEN }}
        run: |
          npm run publish:personalize
          git clone https://x-access-token:${GH_TOKEN}@github.com/priyal-patil/docs-automation-dashboard-data.git /tmp/dashboard-data
          cd /tmp/dashboard-data
          STAGING_DIR="/tmp/reports-personalize"
          if [ -d "$STAGING_DIR" ]; then
            node scripts/publish.js "$GITHUB_WORKSPACE/reports/dashboard-personalize.json:$STAGING_DIR"
          else
            node scripts/publish.js "$GITHUB_WORKSPACE/reports/dashboard-personalize.json"
          fi
          git config user.name "dashboard-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish api-docs-automation/personalize report ($GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do
            git push origin main && break
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personalize-doc-automation-report-${{ github.run_number }}
          path: reports/run-report-personalize.*
          retention-days: 30

      - name: Fail job if critical failures
        run: |
          node -e "
            const r = require('./reports/run-report-personalize.json');
            if (r.failed > 0) {
              console.error('❌ ' + r.failed + ' failure(s) detected');
              process.exit(1);
            }
            console.log('✅ All checks passed');
          "
